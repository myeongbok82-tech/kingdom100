<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><title>100성 국가경영</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e5e7eb;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1280px;margin:auto;padding:12px}.top,.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.clock{font-weight:800;font-size:1.15rem}.muted{color:#9ca3af;font-size:.87rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}.card,.panel{background:#151f30;border:1px solid #2b3a50;border-radius:10px;padding:11px}.big{font-size:1.18rem;font-weight:800}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tab.active,button.primary{background:#334155}.pane{display:none}.pane.active{display:block}button,input,select{background:#0b1220;color:#e5e7eb;border:1px solid #475569;border-radius:7px;padding:8px;font-size:1rem}button{cursor:pointer}.log{font-size:.86rem;line-height:1.55}.good{color:#86efac}.bad{color:#fca5a5}.warn{color:#fde68a}.pill{display:inline-block;border:1px solid #475569;border-radius:99px;padding:3px 8px;margin:2px}.report{border-left:3px solid #64748b;padding-left:9px;margin:8px 0}h2,h3{margin:8px 0 10px}
</style></head><body><div class="wrap">
<div class="top"><div><h2>100성 국가경영</h2><div class="muted">연속 세계시간 · 인구/경제/군사 시뮬레이션</div></div><div><div id="clock" class="clock"></div><div class="muted">현실 1시간 = 게임 24시간</div></div></div>
<div id="summary" class="cards"></div>
<div class="tabs">
<button class="tab active" data-p="realm">내 국가</button><button class="tab" data-p="people">인구/인재</button><button class="tab" data-p="mil">군사/전쟁</button>
<button class="tab" data-p="econ">경제/재정</button><button class="tab" data-p="reports">보고서</button><button class="tab" data-p="world">100개국</button>
</div>
<section id="realm" class="pane active panel"><h3>국가 현황</h3><div id="realmBody"></div></section>
<section id="people" class="pane panel"><h3>인구 구성</h3><div id="peopleBody"></div><h3>연간 모병 계획</h3><div class="row"><input id="annualRecruit" type="number" min="0" value="500"><button id="setRecruit">올해 모집목표 설정</button></div><div id="recruitBody"></div><h3>전문조직</h3><div id="experts"></div></section>
<section id="mil" class="pane panel"><h3>출정 검토</h3><div class="row"><label>목표 <select id="target"></select></label><label>병력 <input id="attackN" type="number" min="100" value="1000"></label><button id="review" class="primary">출정 검토</button></div><div id="warReview"></div><h3>진행 중 군사이동</h3><div id="moves"></div><h3>최근 전투</h3><div id="battle" class="log"></div></section>
<section id="econ" class="pane panel"><h3>경제/재정</h3><div id="econBody"></div><h3>곡물시장</h3><div class="row"><label>수량 <input id="riceN" type="number" min="1" value="100"></label><button id="buyRice">쌀 구매</button><button id="sellRice">쌀 판매</button></div><div class="muted">1금괴 = 1,000엽전. 금괴는 별도 투자자산이 아니라 상위 화폐단위입니다.</div></section>
<section id="reports" class="pane panel"><h3>정기 보고서</h3><div class="muted">세계는 계속 움직이고, 기록은 월·분기·반기·연간 단위로 압축합니다. 중대 사건은 별도 기록합니다.</div><div id="reportBody"></div></section>
<section id="world" class="pane panel"><h3>100개국</h3><div id="worldBody"></div></section>
<div class="panel" style="margin-top:10px"><button id="reset">세계 초기화</button> <span class="muted">기존 저장키 유지 · 브라우저 localStorage</span></div>
</div>
<script>
(()=>{'use strict';
const KEY='kingdom100_complete_v1',DAY=3600000,MONTH=DAY*30,YEAR=MONTH*12,fmt=n=>Math.round(n||0).toLocaleString('ko-KR'),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function rng(seed){let x=seed|0;return()=>{x=(x*1664525+1013904223)|0;return(x>>>0)/4294967296}}
function mk(i,r){let p=Math.round(11000+r()*11000);return{id:i,name:i===1?'1번국 나의 성':i+'번국',pop:p,army:Math.round(700+r()*1500),treasury:70000+r()*70000,privateCash:450000+r()*350000,stateRice:30000+r()*30000,privateRice:70000+r()*70000,wall:12000+r()*18000,ricePrice:80+r()*45,staff:{strategy:40+r()*50,command:40+r()*50,logistics:40+r()*50,fort:40+r()*50,economy:40+r()*50,agriculture:40+r()*50},groups:{child:.18,youth:.27,adult:.38,elder:.17,farm:.34,merchant:.08,official:.025,craft:.08,labor:.10,unemployed:.08,poor:.07,wealthy:.025,criminal:.012},lastBalance:0}}
function fresh(){let r=rng(73129),s=[];for(let i=1;i<=100;i++)s.push(mk(i,r));return{lastReal:Date.now(),gameMs:0,states:s,movements:[],battles:[],events:[],reports:[],recruitPlan:{year:1,target:0,done:0,carry:0}}}
let W;try{W=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){W=fresh()}if(!W.states||W.states.length!==100)W=fresh();
function migrate(){W.movements??=[];W.battles??=[];W.events??=[];W.reports??=[];W.recruitPlan??={year:1,target:0,done:0,carry:0};for(const s of W.states){s.groups??={child:.18,youth:.27,adult:.38,elder:.17,farm:.34,merchant:.08,official:.025,craft:.08,labor:.10,unemployed:.08,poor:.07,wealthy:.025,criminal:.012};s.staff??={strategy:60,command:60,logistics:60,fort:60,economy:60,agriculture:60};}}migrate();
const me=()=>W.states[0],save=()=>{W.lastReal=Date.now();localStorage.setItem(KEY,JSON.stringify(W))};
function cal(){let totalDays=Math.floor(W.gameMs/DAY),year=Math.floor(totalDays/360)+1,dy=totalDays%360,month=Math.floor(dy/30)+1,day=dy%30+1,f=(W.gameMs%DAY)/DAY,h=Math.floor(f*24),mi=Math.floor((f*24-h)*60);return{year,month,day,h,mi}}
function dist(a,b){let d=Math.abs(a-b);return Math.min(d,100-d)}function travel(a,b){return(10+dist(a,b)*1.1)*60000}
function monthStep(){let C=cal(),M=me();if(W.recruitPlan.year!==C.year)W.recruitPlan={year:C.year,target:0,done:0,carry:0};let remain=Math.max(0,W.recruitPlan.target-W.recruitPlan.done),want=W.recruitPlan.target/12+W.recruitPlan.carry,q=Math.min(remain,Math.floor(want),Math.max(0,M.pop-M.army-1000));W.recruitPlan.carry=want-Math.floor(want);if(q>0){M.army+=q;W.recruitPlan.done+=q;M.groups.unemployed=Math.max(.01,M.groups.unemployed-q/M.pop*.45);M.groups.farm=Math.max(.05,M.groups.farm-q/M.pop*.3)}
for(const s of W.states){let civ=Math.max(0,s.pop-s.army),prod=civ*.08*(.8+s.staff.agriculture/250),need=s.pop*.052+s.army*.075;s.privateRice+=prod;let use=Math.min(s.privateRice,need);s.privateRice-=use;let tax=Math.min(s.privateCash,civ*.012);s.privateCash-=tax;s.treasury+=tax;let wage=Math.min(s.treasury,s.army*1.05);s.treasury-=wage;s.privateCash+=wage;s.ricePrice=clamp(s.ricePrice*(1+(need-prod)/Math.max(10000,s.privateRice)*.03),45,240);let growth=clamp((s.privateRice/s.pop-2)/18000,-.0025,.0025);s.pop=Math.max(2000,Math.round(s.pop*(1+growth)));s.lastBalance=tax-wage}
W.reports.unshift({y:C.year,m:C.month,pop:M.pop,army:M.army,cash:M.treasury,rice:M.stateRice,balance:M.lastBalance});W.reports=W.reports.slice(0,120)}
function launch(tid,n){let A=me(),T=W.states[tid-1];n=Math.floor(Math.min(n,A.army-100));if(n<100)return;A.army-=n;W.movements.push({from:1,to:tid,troops:n,start:W.gameMs,arrive:W.gameMs+travel(1,tid)});W.events.unshift('출정: '+T.name+' '+fmt(n)+'명')}
function fight(m){let A=me(),D=W.states[m.to-1],atk=m.troops,def=D.army,fort=1+Math.log1p(D.wall/12000)*.18,aP=atk*(.75+A.staff.command/200)*(.8+A.staff.logistics/250),dP=def*(.75+D.staff.command/200)*fort,share=aP/(aP+dP),aLoss=Math.round(atk*(.12+(1-share)*.28)),dLoss=Math.round(def*(.10+share*.32)),as=Math.max(0,atk-aLoss),ds=Math.max(0,def-dLoss);A.pop=Math.max(0,A.pop-aLoss);D.pop=Math.max(0,D.pop-dLoss);D.army=ds;A.army+=as;let win=as>ds*1.15;W.battles.unshift({from:1,to:m.to,atk,def,aLoss,dLoss,win,time:W.gameMs});W.battles=W.battles.slice(0,100);W.events.unshift('전투: '+D.name+' 공격손실 '+fmt(aLoss)+' / 방어손실 '+fmt(dLoss))}
function process(){let keep=[];for(const m of W.movements){if(W.gameMs>=m.arrive)fight(m);else keep.push(m)}W.movements=keep}
function advance(){let now=Date.now(),d=Math.max(0,now-(W.lastReal||now)),old=Math.floor(W.gameMs/MONTH);W.lastReal=now;W.gameMs+=d;let neu=Math.floor(W.gameMs/MONTH);for(let i=old;i<neu;i++)monthStep();process();save()}
function denom(v){v=Math.floor(v);return fmt(Math.floor(v/1000))+'금괴 '+fmt(v%1000)+'엽전'}
function render(){let M=me(),C=cal();document.querySelector('#clock').textContent=`세계력 ${C.year}년 ${C.month}월 ${C.day}일 ${String(C.h).padStart(2,'0')}:${String(C.mi).padStart(2,'0')}`;
document.querySelector('#summary').innerHTML=[['국고',denom(M.treasury)],['쌀',fmt(M.stateRice)+'석'],['총인구',fmt(M.pop)+'명'],['민간인구',fmt(M.pop-M.army)+'명'],['병력',fmt(M.army)+'명'],['쌀값',fmt(M.ricePrice)+'엽전/석']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('');
document.querySelector('#realmBody').innerHTML=`<div class="cards"><div class="card">월 재정수지<div class="big ${M.lastBalance>=0?'good':'bad'}">${fmt(M.lastBalance)}엽전</div></div><div class="card">성벽<div class="big">${fmt(M.wall)}</div></div><div class="card">민간화폐<div class="big">${denom(M.privateCash)}</div></div><div class="card">민간쌀<div class="big">${fmt(M.privateRice)}석</div></div></div>`;
let G=M.groups;document.querySelector('#peopleBody').innerHTML=`<div class="cards">${[['유아·아동',G.child],['청년층',G.youth],['농민',G.farm],['상인',G.merchant],['공무원',G.official],['무직',G.unemployed],['빈곤층',G.poor],['범죄집단',G.criminal]].map(x=>`<div class="card">${x[0]}<div class="big">${fmt(M.pop*x[1])}명</div></div>`).join('')}</div>`;
document.querySelector('#recruitBody').innerHTML=`<div class="card">${C.year}년 목표 <b>${fmt(W.recruitPlan.target)}명</b> · 충원 <b>${fmt(W.recruitPlan.done)}명</b> · 남음 <b>${fmt(Math.max(0,W.recruitPlan.target-W.recruitPlan.done))}명</b><div class="muted">한 번에 생성되지 않고 기존 민간 직업집단에서 순차적으로 군으로 이동합니다.</div></div>`;
document.querySelector('#experts').innerHTML=`<span class="pill">군사팀 평균 ${M.staff.command.toFixed(0)}</span><span class="pill">재정팀 평균 ${M.staff.economy.toFixed(0)}</span><span class="pill">토지·농업팀 평균 ${M.staff.agriculture.toFixed(0)}</span><span class="pill">첩보팀 평균 ${M.staff.strategy.toFixed(0)}</span>`;
let sel=document.querySelector('#target'),pv=sel.value||'2';sel.innerHTML=W.states.slice(1).map(s=>`<option value="${s.id}">${s.name}</option>`).join('');sel.value=pv;
document.querySelector('#moves').innerHTML=W.movements.length?W.movements.map(m=>`<div class="card">${W.states[m.to-1].name}로 ${fmt(m.troops)}명 이동 · 현실 ${Math.max(0,Math.ceil((m.arrive-W.gameMs)/60000))}분 후 도착</div>`).join(''):'<div class="muted">진행 중 이동 없음</div>';
let b=W.battles[0];document.querySelector('#battle').textContent=b?`${W.states[b.to-1].name} 전투 · ${b.win?'공격 우세':'방어 성공'} · 공격 피해 ${fmt(b.aLoss)} / 방어 피해 ${fmt(b.dLoss)}`:'전투 기록 없음';
document.querySelector('#econBody').innerHTML=`<div class="cards"><div class="card">국고<div class="big">${denom(M.treasury)}</div></div><div class="card">민간화폐<div class="big">${denom(M.privateCash)}</div></div><div class="card">국가쌀<div class="big">${fmt(M.stateRice)}석</div></div><div class="card">현재 쌀값<div class="big">${fmt(M.ricePrice)}엽전</div></div></div>`;
let rs=W.reports.slice(0,12);document.querySelector('#reportBody').innerHTML=rs.length?rs.map((r,i)=>`<div class="report"><b>${r.y}년 ${r.m}월 보고</b> · 인구 ${fmt(r.pop)} · 병력 ${fmt(r.army)} · 국고 ${denom(r.cash)} · 쌀 ${fmt(r.rice)}석 · 수지 ${fmt(r.balance)}엽전${(r.m%3===0?' <span class="pill">분기</span>':'')}${(r.m%6===0?' <span class="pill">반기</span>':'')}${(r.m===12?' <span class="pill">연간</span>':'')}</div>`).join(''):'<div class="muted">첫 월이 지나면 보고서가 생성됩니다.</div>';
document.querySelector('#worldBody').innerHTML=W.states.map(s=>`<span class="pill">${s.name} · 인구 ${fmt(s.pop)} · 병력 약 ${fmt(Math.round(s.army/500)*500)}</span>`).join('');
}
document.addEventListener('click',e=>{if(e.target.matches('.tab')){document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.querySelector('#'+e.target.dataset.p).classList.add('active')}
if(e.target.id==='setRecruit'){let C=cal();W.recruitPlan={year:C.year,target:Math.max(0,Math.floor(+document.querySelector('#annualRecruit').value||0)),done:0,carry:0};save();render()}
if(e.target.id==='review'){let tid=+document.querySelector('#target').value,n=Math.floor(+document.querySelector('#attackN').value||0),T=W.states[tid-1],d=dist(1,tid),fat=clamp(1-d*.012,.65,1),intel=clamp(Math.round(45+(M=me()).staff.strategy-T.staff.strategy),20,95),spread=(100-intel)/100*.6,lo=Math.round(T.army*(1-spread)),hi=Math.round(T.army*(1+spread));document.querySelector('#warReview').innerHTML=`<div class="card"><b>군사전문가 사전보고</b><br>출정 ${fmt(n)}명 / 본국 잔류 ${fmt(Math.max(0,M.army-n))}명<br>적 추정 ${fmt(lo)}~${fmt(hi)}명 (정보신뢰도 ${intel}%)<br>거리 ${d} · 예상 행군 ${Math.round(travel(1,tid)/60000)}분 · 피로계수 ${fat.toFixed(2)}<div class="row" style="margin-top:8px"><button id="approve" data-t="${tid}" data-n="${n}" class="primary">출정 승인</button><button id="cancelReview">철회</button></div></div>`}
if(e.target.id==='approve'){launch(+e.target.dataset.t,+e.target.dataset.n);document.querySelector('#warReview').innerHTML='';save();render()}if(e.target.id==='cancelReview')document.querySelector('#warReview').innerHTML='';
if(e.target.id==='buyRice'||e.target.id==='sellRice'){let M=me(),q=Math.max(0,Math.floor(+document.querySelector('#riceN').value||0));if(e.target.id==='buyRice'){q=Math.min(q,Math.floor(M.treasury/M.ricePrice));let cost=q*M.ricePrice;M.treasury-=cost;M.stateRice+=q;M.privateCash+=cost;M.privateRice=Math.max(0,M.privateRice-q)}else{q=Math.min(q,M.stateRice);let cash=Math.min(M.privateCash,q*M.ricePrice);q=Math.floor(cash/M.ricePrice);M.stateRice-=q;M.treasury+=q*M.ricePrice;M.privateCash-=q*M.ricePrice;M.privateRice+=q}save();render()}
if(e.target.id==='reset'&&confirm('현재 세계를 초기화할까요?')){W=fresh();save();render()}});
advance();render();setInterval(()=>{advance();render()},1000);
})();</script><script>if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script>
</body></html>
